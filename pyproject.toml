[project]
name = "sito-punti"
version = "0.0.20"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.2",
  "Flask-Login==0.6.3",
  "Flask-SQLAlchemy>=3.1.0,<4.0.0",
  "Flask-CORS>=5.0.0",
  "SQLAlchemy==2.0.43",
  "pandas==2.3.2",
  "openpyxl==3.1.5",
  "Werkzeug>=3.1.0,<4.0.0",
  "python-dotenv>=1.2.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
